name: Update Profile

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Render hero and dashboard
        env:
          # GH_PAT (classic, repo scope) lets the dashboard count private
          # commits without naming the repositories. GITHUB_TOKEN alone only
          # sees public ones, and the footnote says so.
          GH_USERNAME: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_dashboard.py

      - name: Generate README
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_readme.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md assets/hero.svg assets/painel.svg
          if ! git diff --cached --quiet; then
            git commit -m "🔄 Auto-update profile"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
